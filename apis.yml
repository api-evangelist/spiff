name: Spiff
description: Spiff was a sales commission and incentive compensation management (ICM) platform that automated commission
  calculations, gave sales reps real-time earnings visibility, and streamlined finance-side reconciliation for revenue
  teams. Founded in Utah and backed by Lightspeed Venture Partners and Norwest Venture Partners, Spiff was acquired
  by Salesforce in 2024 and folded into Sales Cloud as "Salesforce Spiff" / Incentive Compensation Management. As
  of this profile the standalone spiff.com and app.spiff.com properties redirect to salesforce.com, and no independent
  Spiff public API, developer portal, documentation, or OpenAPI surface remains discoverable — its capabilities
  are now delivered through the Salesforce platform.
